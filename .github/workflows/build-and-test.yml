name: Build and run tests

on:
  push:
    tags:
      - '**'
  pull_request:
    types:
      # We want to build when a draft branch is marked ready
      - ready_for_review
      # Default types
      - opened
      - reopened
      - synchronize
  # For manually triggering workflows
  workflow_dispatch:


jobs:

  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ghc: ['9.6', '9.8', '9.10', '9.12']
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cache Cabal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
        restore-keys: |
          build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

    - name: Update cabal index
      run: cabal update

    - name: Build Haskell project
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin

    - name: Run spec tests
      run: cabal test ollama-holes-spec --test-options='--hide-successes'

    - name: Build Documentation
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      run: cabal haddock

    # We save it here so that the haddock builds are saved as well
    - name: Save cabal cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: ${{ steps.cabal-cache.outputs.cache-primary-key }}
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    strategy:
      matrix:
        ghc: ['9.12']
        model: ['qwen3:latest']
    name: Test with GHC ${{ matrix.ghc }} and ${{ matrix.model }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cache Cabal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: demo-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
        restore-keys: |
          build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          demo-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

    - name: Update cabal index
      run: cabal update

    - name: Build Haskell project
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin

    - name: Build Documentation
      run: cabal haddock

    # We save it here so that the haddock builds are saved as well
    - name: Save cabal cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

    - name: Install Ollama
      run: curl -fsSL https://ollama.com/install.sh | sh

    - name: Fetch ${{ matrix.model }}
      run: ollama pull ${{ matrix.model }}

    - name: Build Test project
      run: |
        set -o pipefail
        cabal build exe:ollama-holes-demo \
          --ghc-option "-fforce-recomp" \
          --ghc-option "-fplugin-opt=GHC.Plugin.OllamaHoles:model=${{ matrix.model }}" \
          2>&1 | tee demo-build.log || true
        grep "Valid hole fits" demo-build.log
