name: Build and run tests

on:
  push:
    tags:
      - '**'
  pull_request:
    types:
      # We want to build when a draft branch is marked ready
      - ready_for_review
      # Default types
      - opened
      - reopened
      - synchronize
  # For manually triggering workflows
  workflow_dispatch:



jobs:

  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ['9.6', '9.8', '9.10', '9.12']
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cabal cache
      id: cabal-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          ~/.cabal/bin
          dist-newstyle
        key: ${{ runner.os }}-cabal-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys:
          ${{ runner.os }}-cabal-ghc-${{ matrix.ghc }}-

    - name: Update cabal index
      run: cabal update

    - name: Build Haskell project
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin

    - name: Run spec tests
      run: cabal test ollama-holes-spec --test-options='--hide-successes'

    - name: Build Documentation
      run: cabal haddock

    # We save it here so that the haddock builds are saved as well
    - name: Save cabal cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          ~/.cabal/bin
          dist-newstyle
        key: ${{ steps.cabal-cache.outputs.cache-primary-key }}



  ghc914-experimental:
    name: ubuntu-latest / GHC 9.14 experimental
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14'
          cabal-version: latest
      - run: cabal update

      - name: Build libraries with relaxed dependency bounds
        run: |
          cabal build lib:ollama-holes-lib lib:ollama-holes-plugin \
            --allow-newer=req:template-haskell \
            --allow-newer=modern-uri:template-haskell \
            --allow-newer=text-iso8601:time \
            --allow-newer=serialise:base \
            --allow-newer=serialise:time \
            --allow-newer=serialise:containers \
            --allow-newer=serialise:bytestring \
            --allow-newer=these:base \
            --allow-newer=cborg:base \
            --allow-newer=cborg:containers \
            --allow-newer=cborg:bytestring

      - name: Run spec tests with relaxed dependency bounds
        run: |
          cabal test ollama-holes-spec --test-options='--hide-successes' \
            --allow-newer=req:template-haskell \
            --allow-newer=modern-uri:template-haskell \
            --allow-newer=text-iso8601:time \
            --allow-newer=serialise:base \
            --allow-newer=serialise:time \
            --allow-newer=serialise:containers \
            --allow-newer=serialise:bytestring \
            --allow-newer=these:base \
            --allow-newer=cborg:base \
            --allow-newer=cborg:containers \
            --allow-newer=cborg:bytestring



  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    strategy:
      matrix:
        ghc: ['9.12']
        model: ['qwen3:latest']
    name: Test with GHC ${{ matrix.ghc }} and ${{ matrix.model }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cabal cache
      id: cabal-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          ~/.cabal/bin
          dist-newstyle
        key: ${{ runner.os }}-cabal-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys:
          ${{ runner.os }}-cabal-ghc-${{ matrix.ghc }}-

    - name: Update cabal index
      run: cabal update

    - name: Build Haskell project
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin

    - name: Build Documentation
      run: cabal haddock

    # We save it here so that the haddock builds are saved as well
    - name: Save cabal cache
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          ~/.cabal/bin
          dist-newstyle
        key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

    - name: Install Ollama
      run: curl -fsSL https://ollama.com/install.sh | sh

    - name: Fetch ${{ matrix.model }}
      run: ollama pull ${{ matrix.model }}

    - name: Build Test project
      run: |
        set -o pipefail
        cabal build exe:ollama-holes-demo \
          --ghc-option "-fforce-recomp" \
          --ghc-option "-fplugin-opt=GHC.Plugin.OllamaHoles:model=${{ matrix.model }}" \
          2>&1 | tee demo-build.log || true
        grep "Valid hole fits" demo-build.log
