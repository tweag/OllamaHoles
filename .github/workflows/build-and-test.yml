name: Build and run tests

on:
  push:
    tags:
      - '**'
  pull_request:
    types:
      # We want to build when a draft branch is marked ready
      - ready_for_review
      # Default types
      - opened
      - reopened
      - synchronize
  # For manually triggering workflows
  workflow_dispatch:


jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ghc: ['9.6', '9.8', '9.10', '9.12', '9.14']
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cache Cabal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
        restore-keys: |
          build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

    - name: Update cabal index
      run: cabal update

    # See Note #1
    - name: Build Haskell project
      if: runner.os != 'Windows'
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin
    - name: Build Haskell project
      if: runner.os == 'Windows'
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin --jobs=1

    # See Note #1
    - name: Run spec tests
      if: runner.os != 'Windows'
      run: cabal test ollama-holes-spec --test-options='--hide-successes'
    - name: Run spec tests
      if: runner.os == 'Windows'
      run: cabal test ollama-holes-spec --test-options='--hide-successes' --jobs=1

    - name: Build Documentation
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.12'
      run: cabal haddock ollama-holes-plugin -w ghc-${{ matrix.ghc }}

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    strategy:
      matrix:
        ghc: ['9.12']
        model: ['qwen3:latest']
    name: Test with GHC ${{ matrix.ghc }} and ${{ matrix.model }}
    steps:
    - uses: actions/checkout@v4

    # Haskell pipeline
    - name: Install Cabal/GHC
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    # We restore the cabal packages, but also .cabal/bin for fourmolu
    - name: Cache Cabal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: demo-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
        restore-keys: |
          build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          demo-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-
          ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

    - name: Update cabal index
      run: cabal update

    # See Note #1
    - name: Build Haskell project
      if: runner.os != 'Windows'
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin
    - name: Build Haskell project
      if: runner.os == 'Windows'
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin --jobs=1

    - name: Install Ollama
      run: curl -fsSL https://ollama.com/install.sh | sh

    - name: Fetch ${{ matrix.model }}
      run: ollama pull ${{ matrix.model }}

    - name: Build Test project
      run: |
        set -o pipefail
        cabal build ollama-holes-demo:exe:ollama-holes-basic-demo \
          --ghc-option "-fforce-recomp" \
          --ghc-option "-fplugin-opt=GHC.Plugin.OllamaHoles:model=${{ matrix.model }}" \
          2>&1 | tee demo-build.log || true
        grep "Valid hole fits" demo-build.log

  ollama-haskell-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: '9.12'
            package: 'ollama-haskell'
            version: '0.1.3.*'
          - ghc: '9.12'
            package: 'ollama-haskell'
            version: '0.2.0.*'
          - ghc: '9.12'
            package: toml-parser
            version: '2.0.1.*'
          - ghc: '9.12'
            package: toml-parser
            version: '2.0.2.*'
          - ghc: '9.6'
            package: aeson
            version: '2.1.*'
          - ghc: '9.12'
            package: aeson
            version: '2.2.*'

    name: dependency ${{ matrix.package }}-${{ matrix.version }} with GHC ${{ matrix.ghc }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Cabal/GHC
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Cache Cabal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ${{ steps.setup-haskell.outputs.cabal-store }}
          ~/.cabal/bin
          dist-newstyle
        key: compat-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ matrix.package }}-${{ matrix.version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          compat-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ matrix.package }}-${{ matrix.version }}-
          build-${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

    - name: Update cabal index
      run: cabal update

    - name: Pin dependency ${{ matrix.package }}
      run: |
        cat > cabal.project.local <<EOF
        constraints: ${{ matrix.package }} == ${{ matrix.version }}
        EOF

    - name: Build Haskell project
      run: cabal build lib:ollama-holes-lib lib:ollama-holes-plugin

    - name: Run spec tests
      run: cabal test ollama-holes-spec --test-options='--hide-successes'


# Notes
# =====

# Note #1:
# Running concurrent build tasks on Windows can cause intermittent permission errors like this:
# ghc-pkg-9.10.3.exe: C:foo\\package.db\package.cache: you don't have permission to modify this file
# The cause is a race condition. To avoid a flaky build we use only one concurrent job on windows.
